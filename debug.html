<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试控制台 - MagnetCat</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: #000;
            color: #0f0;
            height: 100vh;
            padding: 16px;
        }
        #log-container {
            height: 100%;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
        }
        .log-line { padding: 2px 0; border-bottom: 1px solid #222; }
        .log-time { color: #666; margin-right: 10px; }
        .log-level { margin-right: 8px; padding: 2px 6px; border-radius: 3px; font-size: 10px; }
        .info { background: #0f02; color: #0f0; }
        .warn { background: #ff02; color: #ff0; }
        .error { background: #f002; color: #f00; }
        .debug { background: #00f2; color: #0af; }
    </style>
</head>
<body>
    <div id="log-container"></div>
    <script>
        const { ipcRenderer } = require('electron');
        const container = document.getElementById('log-container');
        
        function addLog(logStr) {
            const match = logStr.match(/\[([^\]]+)\]\s+\[([^\]]+)\]\s+(.*)/);
            if (match) {
                const div = document.createElement('div');
                div.className = 'log-line';
                div.innerHTML = '<span class="log-time">' + match[1] + '</span><span class="log-level ' + match[2].toLowerCase() + '">' + match[2].toUpperCase() + '</span><span>' + match[3] + '</span>';
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }
        }
        
        addLog('[DEBUG] 调试窗口已启动');
        ipcRenderer.on('debug-log', (_, log) => addLog(log));
    </script>
</body>
</html>
