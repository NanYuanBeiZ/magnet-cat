<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁力猫 - MagnetCat</title>
    <script>
        (function() {
            const dark = localStorage.getItem('darkMode') === 'true';
            if (dark) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f7;
            --bg-card: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border-color: #d2d2d7;
            --accent: #007aff;
            --accent-hover: #0056b3;
            --danger: #ff3b30;
            --success: #34c759;
            --warning: #ff9500;
        }
        .dark {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-card: #2c2c2e;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --border-color: #38383a;
            --accent: #0a84ff;
            --accent-hover: #409cff;
        }
        html, body, #app {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }
        * {
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }
        .title-bar {
            height: 32px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            border-bottom: 1px solid var(--border-color);
            -webkit-app-region: drag;
        }
        .title-bar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
        }
        .title-bar-icon {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .title-bar-right {
            display: flex;
            gap: 4px;
            -webkit-app-region: no-drag;
        }
        .window-btn {
            width: 32px;
            height: 24px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .window-btn:hover {
            background: var(--border-color);
        }
        .window-btn.close:hover {
            background: var(--danger);
            color: white;
        }
        .toolbar {
            height: 56px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .search-box {
            flex: 1;
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }
        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 14px;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
        }
        .search-btn {
            border: none;
            background: var(--accent);
            color: white;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .search-btn:hover {
            background: var(--accent-hover);
        }
        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .toolbar-btn {
            height: 40px;
            padding: 0 16px;
            border: none;
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-color);
        }
        .toolbar-btn:hover {
            background: var(--border-color);
        }
        .toolbar-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .toolbar-btn .badge {
            background: var(--danger);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }
        .main-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .results-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--bg-secondary);
        }
        .tag.video { background: #ff6b6b20; color: #ff6b6b; }
        .tag.zip { background: #feca5720; color: #feca57; }
        .tag.doc { background: #54a0ff20; color: #54a0ff; }
        .tag.audio { background: #5f27cd20; color: #5f27cd; }
        .tag.img { background: #00d2d320; color: #00d2d3; }
        .magnet-preview {
            font-size: 11px;
            color: var(--text-secondary);
            font-family: monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }
        .btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        .btn-primary.success {
            background: var(--success);
        }
        .btn-icon {
            padding: 8px;
            flex: none;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .btn-icon:hover {
            background: var(--border-color);
        }
        .btn-icon.favorited {
            color: var(--danger);
        }
        .status-bar {
            height: 28px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
        }
        .status-dot.searching {
            background: var(--warning);
            animation: pulse 1s infinite;
        }
        .status-dot.success {
            background: var(--success);
        }
        .status-dot.error {
            background: var(--danger);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .progress-bar {
            height: 4px;
            background: var(--bg-secondary);
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            gap: 16px;
        }
        .empty-icon {
            font-size: 64px;
            opacity: 0.5;
        }
        .settings-page, .favorites-page {
            padding: 24px;
            overflow-y: auto;
            height: 100%;
        }
        .section {
            margin-bottom: 32px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--accent);
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .help-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .help-text a {
            color: var(--accent);
            cursor: pointer;
        }
        .password-strength {
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .password-strength-fill {
            height: 100%;
            transition: width 0.3s, background 0.3s;
        }
        .strength-1 { width: 25%; background: var(--danger); }
        .strength-2 { width: 50%; background: var(--warning); }
        .strength-3 { width: 75%; background: var(--accent); }
        .strength-4 { width: 100%; background: var(--success); }
        .unlock-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            width: 360px;
            border: 1px solid var(--border-color);
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .modal-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .btn-outline:hover {
            background: var(--bg-secondary);
        }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            opacity: 0.9;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .back-btn {
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sync-status {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .toast {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 999;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.error {
            background: var(--danger);
            color: white;
        }
        .toast.success {
            background: var(--success);
            color: white;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const { createApp, ref, reactive, computed, watch, onMounted, nextTick } = Vue;
        const { createRouter, createWebHashHistory } = VueRouter;
        const { ipcRenderer } = require('electron');

        const store = reactive({
            darkMode: localStorage.getItem('darkMode') === 'true',
            favorites: [],
            favoritesLoaded: false,
            searchResults: [],
            isSearching: false,
            searchProgress: 0,
            searchTotal: 0,
            statusText: '就绪',
            statusType: 'idle',
            cloudConfigured: false,
            cloudToken: '',
            cloudPassword: '',
            cloudRepo: '',
            cloudLastSync: ''
        });

        function loadFavorites() {
            try {
                const data = localStorage.getItem('magnet_favorites');
                store.favorites = data ? JSON.parse(data) : [];
            } catch (e) {
                store.favorites = [];
            }
            store.favoritesLoaded = true;
        }

        function saveFavorites() {
            localStorage.setItem('magnet_favorites', JSON.stringify(store.favorites));
            if (store.cloudConfigured && store.cloudPassword) {
                ipcRenderer.invoke('cloud-favorite-changed', {
                    data: store.favorites,
                    password: store.cloudPassword
                });
            }
        }

        function isFavorited(magnet) {
            return store.favorites.some(f => f.magnet === magnet);
        }

        function toggleFavorite(item) {
            const idx = store.favorites.findIndex(f => f.magnet === item.magnet);
            if (idx >= 0) {
                store.favorites.splice(idx, 1);
            } else {
                store.favorites.unshift({ ...item });
            }
            saveFavorites();
        }

        function getFileType(title) {
            const t = title.toLowerCase();
            if (/\.(mp4|mkv|avi|mov|wmv|flv|webm)$/.test(t)) return 'video';
            if (/\.(rar|zip|7z|tar|gz)$/.test(t)) return 'zip';
            if (/\.(pdf|doc|docx|txt|xls|xlsx)$/.test(t)) return 'doc';
            if (/\.(mp3|wav|flac|aac|ogg)$/.test(t)) return 'audio';
            if (/\.(jpg|jpeg|png|gif|bmp|svg)$/.test(t)) return 'img';
            return 'other';
        }

        const SearchPage = {
            template: `
                <div class="main-content">
                    <div class="progress-bar" v-if="store.isSearching">
                        <div class="progress-fill" :style="{ width: (store.searchResults.length / store.searchTotal * 100) + '%' }"></div>
                    </div>
                    <div class="results-container">
                        <div v-if="!store.isSearching && store.searchResults.length === 0" class="empty-state">
                            <div class="empty-icon">🔍</div>
                            <div>输入关键词开始搜索磁力链接</div>
                        </div>
                        <div v-else class="card-grid">
                            <div v-for="(item, idx) in sortedResults" :key="item.magnet" class="card">
                                <div class="card-title">{{ item.title }}</div>
                                <div class="card-meta">
                                    <span class="tag">{{ item.size }}</span>
                                    <span class="tag" :class="getFileType(item.title)">{{ getFileTypeLabel(item.title) }}</span>
                                    <span class="tag">🔥 {{ item.magnetCount }}</span>
                                </div>
                                <div class="magnet-preview">{{ item.magnet.substring(0, 70) }}...</div>
                                <div class="card-actions">
                                    <button class="btn btn-primary" :class="{ success: copied === item.magnet }" @click="copyMagnet(item)">
                                        {{ copied === item.magnet ? '已复制' : '复制磁链' }}
                                    </button>
                                    <button class="btn btn-icon" :class="{ favorited: isFavorited(item.magnet) }" @click="toggleFavorite(item)">
                                        {{ isFavorited(item.magnet) ? '❤️' : '🤍' }}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const copied = ref('');
                const sortedResults = computed(() => {
                    return [...store.searchResults].sort((a, b) => {
                        if (b.magnetCount !== a.magnetCount) return b.magnetCount - a.magnetCount;
                        return b.sizeBytes - a.sizeBytes;
                    });
                });
                const copyMagnet = (item) => {
                    navigator.clipboard.writeText(item.magnet);
                    copied.value = item.magnet;
                    setTimeout(() => copied.value = '', 2500);
                };
                return { store, copied, sortedResults, copyMagnet, isFavorited, toggleFavorite, getFileType, getFileTypeLabel: (t) => {
                    const map = { video: '视频', zip: '压缩', doc: '文档', audio: '音频', img: '图片', other: '其他' };
                    return map[getFileType(t)] || '其他';
                } };
            }
        };

        const FavoritesPage = {
            template: `
                <div class="favorites-page">
                    <div class="page-header">
                        <button class="back-btn" @click="$router.push('/')">← 返回搜索</button>
                        <div class="sync-status" v-if="store.cloudLastSync">
                            上次同步: {{ formatSyncTime(store.cloudLastSync) }}
                        </div>
                    </div>
                    <div v-if="store.favorites.length === 0" class="empty-state">
                        <div class="empty-icon">📁</div>
                        <div>还没有收藏的磁力链接</div>
                    </div>
                    <div v-else class="card-grid">
                        <div v-for="item in store.favorites" :key="item.magnet" class="card">
                            <div class="card-title">{{ item.title }}</div>
                            <div class="card-meta">
                                <span class="tag">{{ item.size }}</span>
                                <span class="tag" :class="getFileType(item.title)">{{ getFileTypeLabel(item.title) }}</span>
                                <span class="tag">🔥 {{ item.magnetCount }}</span>
                            </div>
                            <div class="magnet-preview">{{ item.magnet.substring(0, 70) }}...</div>
                            <div class="card-actions">
                                <button class="btn btn-primary" :class="{ success: copied === item.magnet }" @click="copyMagnet(item)">
                                    {{ copied === item.magnet ? '已复制' : '复制磁链' }}
                                </button>
                                <button class="btn btn-icon favorited" @click="toggleFavorite(item)">❤️</button>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const copied = ref('');
                const copyMagnet = (item) => {
                    navigator.clipboard.writeText(item.magnet);
                    copied.value = item.magnet;
                    setTimeout(() => copied.value = '', 2500);
                };
                const formatSyncTime = (t) => {
                    if (!t) return '';
                    const d = new Date(t);
                    return d.toLocaleString('zh-CN');
                };
                return { store, copied, copyMagnet, toggleFavorite, isFavorited, getFileType, getFileTypeLabel: (t) => {
                    const map = { video: '视频', zip: '压缩', doc: '文档', audio: '音频', img: '图片', other: '其他' };
                    return map[getFileType(t)] || '其他';
                }, formatSyncTime };
            }
        };

        const SettingsPage = {
            template: `
                <div class="settings-page">
                    <div class="page-header">
                        <button class="back-btn" @click="$router.push('/')">← 返回搜索</button>
                    </div>

                    <div class="section">
                        <div class="section-title">云同步设置</div>
                        
                        <div v-if="showUnlock" class="unlock-modal">
                            <div class="modal-content">
                                <div class="modal-title">输入密码解锁</div>
                                <div class="modal-desc">请输入加密密码以访问云同步设置</div>
                                <div class="form-group">
                                    <input class="form-input" type="password" v-model="unlockPassword" placeholder="请输入密码" @keyup.enter="doUnlock" />
                                </div>
                                <div class="help-text" v-if="unlockError" style="color: var(--danger)">{{ unlockError }}</div>
                                <div class="modal-actions">
                                    <button class="btn btn-outline" @click="resetPassword">忘记密码</button>
                                    <button class="btn btn-primary" @click="doUnlock">解锁</button>
                                </div>
                            </div>
                        </div>

                        <div v-else>
                            <div class="form-group">
                                <label class="form-label">Gitee 私人令牌</label>
                                <input class="form-input" type="password" v-model="settings.token" :placeholder="savedToken ? '已保存' : '请输入令牌'" />
                                <div class="help-text">
                                    在 <a @click="openGiteeHelp">Gitee 设置</a> 中生成，需要 projects 权限
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">仓库名称</label>
                                <input class="form-input" type="text" v-model="settings.repo" placeholder="例如: user/repo" />
                            </div>
                            <div class="form-group">
                                <label class="form-label">加密密码</label>
                                <input class="form-input" type="password" v-model="settings.password" :placeholder="savedPassword ? '已保存' : '至少6位'" @input="checkPasswordStrength" />
                                <div class="password-strength" v-if="settings.password">
                                    <div class="password-strength-fill" :class="'strength-' + passwordStrength"></div>
                                </div>
                                <div class="help-text">用于加密数据，不同密码生成不同的同步文件</div>
                            </div>
                            <div class="modal-actions">
                                <button class="btn btn-outline" @click="testConnection" :disabled="!settings.repo || !settings.token">
                                    {{ testing ? '测试中...' : '测试连接' }}
                                </button>
                                <button class="btn btn-primary" @click="saveSettings" :disabled="!settings.repo || !settings.token || settings.password.length < 6">
                                    保存设置
                                </button>
                            </div>
                            <div class="help-text" v-if="saveMessage" :style="{ color: saveSuccess ? 'var(--success)' : 'var(--danger)' }">{{ saveMessage }}</div>

                            <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-color)">
                                <div class="section-title" style="font-size: 14px; margin-bottom: 12px">同步操作</div>
                                <div class="modal-actions">
                                    <button class="btn btn-outline" @click="doPull">拉取云端</button>
                                    <button class="btn btn-primary" @click="doPush">推送本地</button>
                                </div>
                                <div class="help-text" v-if="syncMessage" :style="{ color: syncSuccess ? 'var(--success)' : 'var(--danger)' }">{{ syncMessage }}</div>
                            </div>

                            <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-color)">
                                <button class="btn btn-danger" @click="clearAllData">清除所有数据</button>
                            </div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">外观</div>
                        <div class="modal-actions">
                            <button class="btn" :class="store.darkMode ? 'btn-outline' : 'btn-primary'" @click="setDarkMode(false)">☀️ 浅色</button>
                            <button class="btn" :class="store.darkMode ? 'btn-primary' : 'btn-outline'" @click="setDarkMode(true)">🌙 深色</button>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">调试</div>
                        <button class="btn btn-outline" @click="openDebug">打开调试窗口</button>
                    </div>
                </div>
            `,
            setup() {
                const showUnlock = ref(false);
                const unlockPassword = ref('');
                const unlockError = ref('');
                const settings = reactive({ repo: '', token: '', password: '' });
                const savedToken = ref(false);
                const savedPassword = ref(false);
                const passwordStrength = ref(0);
                const testing = ref(false);
                const saveMessage = ref('');
                const saveSuccess = ref(true);
                const syncMessage = ref('');
                const syncSuccess = ref(true);

                const loadSettings = async () => {
                    const configured = await ipcRenderer.invoke('cloud-is-configured');
                    if (configured) {
                        const autoRes = await ipcRenderer.invoke('cloud-auto-unlock');
                        if (autoRes.success) {
                            store.cloudConfigured = true;
                            store.cloudToken = autoRes.token;
                            store.cloudPassword = autoRes.password;
                            store.cloudRepo = autoRes.repo;
                            settings.repo = autoRes.repo;
                            settings.token = '***';
                            settings.password = '***';
                            savedToken.value = true;
                            savedPassword.value = true;
                            showUnlock.value = false;
                        } else {
                            showUnlock.value = true;
                        }
                    }
                    const status = await ipcRenderer.invoke('cloud-get-status');
                    store.cloudLastSync = status.lastSyncTime;
                };

                const doUnlock = async () => {
                    const res = await ipcRenderer.invoke('cloud-unlock', { password: unlockPassword.value });
                    if (res.success) {
                        store.cloudConfigured = true;
                        store.cloudToken = res.token;
                        store.cloudPassword = unlockPassword.value;
                        store.cloudRepo = res.repo;
                        settings.repo = res.repo;
                        settings.token = '***';
                        settings.password = '***';
                        savedToken.value = true;
                        savedPassword.value = true;
                        showUnlock.value = false;
                        unlockError.value = '';
                    } else {
                        unlockError.value = res.message || '密码错误';
                    }
                };

                const resetPassword = async () => {
                    if (confirm('重置密码后将使用本地数据覆盖云端，确定继续？')) {
                        await ipcRenderer.invoke('cloud-reset-password');
                        showUnlock.value = false;
                        savedToken.value = false;
                        savedPassword.value = false;
                        store.cloudConfigured = false;
                        settings.repo = '';
                        settings.token = '';
                        settings.password = '';
                    }
                };

                const checkPasswordStrength = () => {
                    const len = settings.password.length;
                    if (len < 4) passwordStrength.value = 1;
                    else if (len < 6) passwordStrength.value = 2;
                    else if (len < 10) passwordStrength.value = 3;
                    else passwordStrength.value = 4;
                };

                const testConnection = async () => {
                    testing.value = true;
                    const res = await ipcRenderer.invoke('cloud-test-connection', {
                        repo: settings.repo,
                        token: savedToken.value ? store.cloudToken : settings.token
                    });
                    testing.value = false;
                    saveMessage.value = res.success ? '连接成功！' : res.message;
                    saveSuccess.value = res.success;
                    setTimeout(() => saveMessage.value = '', 3000);
                };

                const saveSettings = async () => {
                    const isFirst = !store.cloudConfigured;
                    const res = await ipcRenderer.invoke('cloud-save-settings', {
                        repo: settings.repo,
                        token: savedToken.value ? store.cloudToken : settings.token,
                        password: savedPassword.value ? store.cloudPassword : settings.password,
                        isFirstSave: isFirst
                    });
                    if (res.success) {
                        store.cloudConfigured = true;
                        store.cloudToken = savedToken.value ? store.cloudToken : settings.token;
                        store.cloudPassword = savedPassword.value ? store.cloudPassword : settings.password;
                        store.cloudRepo = settings.repo;
                        savedToken.value = true;
                        savedPassword.value = true;
                        settings.token = '***';
                        settings.password = '***';
                        saveMessage.value = '保存成功！';
                        saveSuccess.value = true;
                        if (isFirst) {
                            await doPull();
                        }
                    } else {
                        saveMessage.value = res.message || '保存失败';
                        saveSuccess.value = false;
                    }
                    setTimeout(() => saveMessage.value = '', 3000);
                };

                const doPull = async () => {
                    syncMessage.value = '正在拉取...';
                    const res = await ipcRenderer.invoke('cloud-sync', {
                        direction: 'pull',
                        password: savedPassword.value ? store.cloudPassword : settings.password
                    });
                    if (res.success) {
                        if (!res.noData) {
                            store.favorites = res.items || [];
                            saveFavorites();
                        }
                        syncSuccess.value = true;
                        syncMessage.value = res.noData ? '云端无数据' : '拉取成功！';
                        const status = await ipcRenderer.invoke('cloud-get-status');
                        store.cloudLastSync = status.lastSyncTime;
                    } else {
                        syncSuccess.value = false;
                        syncMessage.value = res.message || '拉取失败';
                    }
                    setTimeout(() => syncMessage.value = '', 3000);
                };

                const doPush = async () => {
                    syncMessage.value = '正在推送...';
                    const res = await ipcRenderer.invoke('cloud-sync', {
                        direction: 'push',
                        password: savedPassword.value ? store.cloudPassword : settings.password,
                        data: store.favorites
                    });
                    if (res.success) {
                        syncSuccess.value = true;
                        syncMessage.value = '推送成功！';
                        const status = await ipcRenderer.invoke('cloud-get-status');
                        store.cloudLastSync = status.lastSyncTime;
                    } else {
                        syncSuccess.value = false;
                        syncMessage.value = res.message || '推送失败';
                    }
                    setTimeout(() => syncMessage.value = '', 3000);
                };

                const clearAllData = async () => {
                    if (confirm('确定清除所有云同步配置？本地收藏不会删除。')) {
                        await ipcRenderer.invoke('cloud-clear-all-data');
                        store.cloudConfigured = false;
                        store.cloudToken = '';
                        store.cloudPassword = '';
                        store.cloudRepo = '';
                        store.cloudLastSync = '';
                        savedToken.value = false;
                        savedPassword.value = false;
                        settings.repo = '';
                        settings.token = '';
                        settings.password = '';
                        showUnlock.value = false;
                    }
                };

                const openGiteeHelp = () => ipcRenderer.send('open-gitee-help');
                const setDarkMode = (v) => {
                    store.darkMode = v;
                    localStorage.setItem('darkMode', v);
                    if (v) document.documentElement.classList.add('dark');
                    else document.documentElement.classList.remove('dark');
                };
                const openDebug = () => ipcRenderer.send('open-debug');

                onMounted(loadSettings);
                return {
                    store, showUnlock, unlockPassword, unlockError, settings,
                    savedToken, savedPassword, passwordStrength, testing,
                    saveMessage, saveSuccess, syncMessage, syncSuccess,
                    doUnlock, resetPassword, checkPasswordStrength, testConnection,
                    saveSettings, doPull, doPush, clearAllData, openGiteeHelp,
                    setDarkMode, openDebug
                };
            }
        };

        const router = createRouter({
            history: createWebHashHistory(),
            routes: [
                { path: '/', component: SearchPage },
                { path: '/favorites', component: FavoritesPage },
                { path: '/settings', component: SettingsPage }
            ]
        });

        const App = {
            template: `
                <div style="height: 100%; display: flex; flex-direction: column">
                    <div class="title-bar">
                        <div class="title-bar-left">
                            <div class="title-bar-icon">🐱</div>
                            <span>磁力猫</span>
                        </div>
                        <div class="title-bar-right">
                            <button class="window-btn" @click="minimize">−</button>
                            <button class="window-btn" @click="toggleMaximize">{{ isMax ? '❒' : '□' }}</button>
                            <button class="window-btn close" @click="close">×</button>
                        </div>
                    </div>
                    <div class="toolbar">
                        <div class="search-box">
                            <input class="search-input" v-model="searchKeyword" placeholder="输入关键词搜索..." @keyup.enter="doSearch" />
                            <button class="search-btn" @click="doSearch" :disabled="store.isSearching">
                                {{ store.isSearching ? '搜索中...' : '搜索' }}
                            </button>
                        </div>
                        <button class="toolbar-btn" :class="{ active: $route.path === '/favorites' }" @click="$router.push('/favorites')">
                            📁 收藏
                            <span v-if="store.favorites.length > 0" class="badge">{{ store.favorites.length }}</span>
                        </button>
                        <button class="toolbar-btn" :class="{ active: $route.path === '/settings' }" @click="$router.push('/settings')">
                            ⚙️ 设置
                        </button>
                    </div>
                    <router-view style="flex: 1; overflow: hidden; display: flex; flex-direction: column" />
                    <div class="status-bar">
                        <div class="status-left">
                            <div class="status-dot" :class="statusDotClass"></div>
                            <span>{{ store.statusText }}</span>
                        </div>
                        <div>
                            {{ $route.path === '/' ? (store.searchResults.length ? '共 ' + store.searchResults.length + ' 个结果' : '') : (store.favorites.length ? '共 ' + store.favorites.length + ' 个收藏' : '') }}
                        </div>
                    </div>
                    <div class="toast" :class="{ show: showToast, [toastType]: true }">{{ toastMessage }}</div>
                </div>
            `,
            setup() {
                const searchKeyword = ref('');
                const isMax = ref(false);
                const showToast = ref(false);
                const toastMessage = ref('');
                const toastType = ref('');

                const statusDotClass = computed(() => {
                    if (store.isSearching) return 'searching';
                    if (store.statusType === 'error') return 'error';
                    if (store.statusType === 'success') return 'success';
                    return '';
                });

                const minimize = () => ipcRenderer.invoke('minimize');
                const toggleMaximize = async () => isMax.value = await ipcRenderer.invoke('maximize');
                const close = () => ipcRenderer.invoke('close');

                const doSearch = () => {
                    if (!searchKeyword.value.trim() || store.isSearching) return;
                    store.searchResults = [];
                    store.isSearching = true;
                    store.searchTotal = 0;
                    store.statusText = '正在搜索...';
                    store.statusType = 'searching';
                    ipcRenderer.send('search', searchKeyword.value.trim());
                };

                const showToastFn = (msg, type = '') => {
                    toastMessage.value = msg;
                    toastType.value = type;
                    showToast.value = true;
                    setTimeout(() => showToast.value = false, 3000);
                };

                ipcRenderer.on('search-total', (_, total) => {
                    store.searchTotal = total;
                    store.statusText = '正在获取磁力链接...';
                });
                ipcRenderer.on('search-result', (_, result) => {
                    store.searchResults.push(result);
                });
                ipcRenderer.on('search-complete', (_, stats) => {
                    store.isSearching = false;
                    store.statusType = 'success';
                    store.statusText = \`搜索完成！成功 \${stats.success} 个，失败 \${stats.fail} 个（耗时 \${(stats.duration/1000).toFixed(1)}s）\`;
                });
                ipcRenderer.on('search-error', (_, msg) => {
                    store.isSearching = false;
                    store.statusType = 'error';
                    store.statusText = '搜索失败：' + msg;
                    showToastFn(msg, 'error');
                });

                onMounted(async () => {
                    isMax.value = await ipcRenderer.invoke('isMaximized');
                    loadFavorites();
                    const configured = await ipcRenderer.invoke('cloud-is-configured');
                    store.cloudConfigured = configured;
                    if (configured) {
                        const autoRes = await ipcRenderer.invoke('cloud-auto-unlock');
                        if (autoRes.success) {
                            store.cloudToken = autoRes.token;
                            store.cloudPassword = autoRes.password;
                            store.cloudRepo = autoRes.repo;
                            setTimeout(async () => {
                                const res = await ipcRenderer.invoke('cloud-sync', {
                                    direction: 'pull',
                                    password: autoRes.password
                                });
                                if (res.success && !res.noData) {
                                    store.favorites = res.items || [];
                                    saveFavorites();
                                }
                            }, 3000);
                        }
                    }
                    const status = await ipcRenderer.invoke('cloud-get-status');
                    store.cloudLastSync = status.lastSyncTime;
                });

                return {
                    store, searchKeyword, isMax, showToast, toastMessage, toastType, statusDotClass,
                    minimize, toggleMaximize, close, doSearch
                };
            }
        };

        const app = createApp(App);
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
